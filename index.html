<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS v9.0 // SISTEMA DE PERSISTENCIA TOTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #050505; --panel: rgba(10, 20, 30, 0.95); --success: #00ff66; --danger: #ff0055; }
        body {
            background-color: var(--bg); color: var(--neon); font-family: 'Share Tech Mono', monospace;
            background-image: linear-gradient(0deg, transparent 24%, rgba(0, 242, 255, .03) 25%, rgba(0, 242, 255, .03) 26%, transparent 27%, transparent 74%, rgba(0, 242, 255, .03) 75%, rgba(0, 242, 255, .03) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(0, 242, 255, .03) 25%, rgba(0, 242, 255, .03) 26%, transparent 27%, transparent 74%, rgba(0, 242, 255, .03) 75%, rgba(0, 242, 255, .03) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            min-height: 100vh; overflow-x: hidden;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        /* HUD CONTAINERS */
        .hud-panel {
            border: 1px solid #004455; background: var(--panel);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.05);
            position: relative;
        }
        .hud-panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon), transparent);
        }

        /* BUTTONS */
        .cyber-btn { 
            background: rgba(0, 242, 255, 0.1); border: 1px solid var(--neon); color: var(--neon);
            padding: 8px 16px; font-family: 'Orbitron'; font-size: 10px; cursor: pointer; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .cyber-btn:hover { background: var(--neon); color: black; box-shadow: 0 0 15px var(--neon); }

        .btn-danger { border-color: var(--danger); color: var(--danger); background: rgba(255, 0, 85, 0.1); }
        .btn-danger:hover { background: var(--danger); color: white; box-shadow: 0 0 15px var(--danger); }

        .btn-success { border-color: var(--success); color: var(--success); background: rgba(0, 255, 102, 0.1); }
        .btn-success:hover { background: var(--success); color: black; box-shadow: 0 0 15px var(--success); }

        /* INPUTS */
        .cyber-input {
            background: #000; border: 1px solid #004455; color: white; padding: 10px; width: 100%;
            font-family: 'Share Tech Mono'; outline: none; transition: 0.3s;
        }
        .cyber-input:focus { border-color: var(--neon); }

        /* ANIMATIONS */
        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        .scan-effect { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: linear-gradient(to bottom, transparent 50%, rgba(0, 242, 255, 0.02) 51%); background-size: 100% 4px; z-index: 999; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="scan-effect"></div>
    <audio id="bg-music" loop><source src="musica1.mp3" type="audio/mpeg"></audio>

    <header class="max-w-7xl mx-auto flex justify-between items-end mb-8 border-b border-cyan-900 pb-4">
        <div>
            <h1 class="orbitron text-3xl font-black italic tracking-tighter text-white">NEXUS<span class="text-cyan-400">_CORE_v9</span></h1>
            <p class="text-xs text-cyan-600 tracking-[0.2em]">SISTEMA DE ARCHIVOS PERSISTENTE</p>
        </div>
        <div class="text-right">
            <div id="db-status" class="text-xs font-bold text-yellow-500 mb-1">● INICIANDO DB...</div>
            <div id="clock" class="orbitron text-xl">00:00:00</div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-4 space-y-6">
            
            <div class="hud-panel p-6">
                <h3 class="orbitron text-xs text-cyan-400 mb-4 border-b border-cyan-900 pb-2">INGESTA DE DATOS (APKS/VIDEOS)</h3>
                
                <input type="file" id="fileInput" class="hidden" onchange="processFile(this)">
                <button onclick="document.getElementById('fileInput').click()" class="w-full h-32 border-2 border-dashed border-cyan-800 hover:border-cyan-400 hover:bg-cyan-900/20 transition-all group flex flex-col items-center justify-center cursor-pointer">
                    <span class="text-4xl mb-2 group-hover:scale-110 transition-transform">📥</span>
                    <span class="text-[10px] font-bold uppercase tracking-widest">CLIC PARA SUBIR ARCHIVO</span>
                </button>
                <div id="upload-status" class="mt-2 text-[10px] text-center opacity-0 transition-opacity text-yellow-400">ENCRIPTANDO DATOS... ESPERE...</div>
            </div>

            <div class="hud-panel p-6">
                <h3 class="orbitron text-xs text-cyan-400 mb-4 border-b border-cyan-900 pb-2">ENLACES WEB</h3>
                <div class="space-y-3">
                    <input type="text" id="linkName" placeholder="NOMBRE DEL SITIO" class="cyber-input">
                    <input type="text" id="linkURL" placeholder="URL (HTTPS://...)" class="cyber-input">
                    <button onclick="saveWebLink()" class="cyber-btn w-full font-bold">GUARDAR ENLACE</button>
                </div>
            </div>

            <div class="hud-panel p-4 h-40 flex flex-col">
                <div id="logs" class="overflow-y-auto flex-grow text-[10px] space-y-1 font-mono text-cyan-300/80">
                    <div>> Sistema de arranque iniciado...</div>
                </div>
            </div>

            <button onclick="wipeSystem()" class="w-full py-3 text-xs text-red-500 border border-red-900 hover:bg-red-900/50 hover:text-white transition-all uppercase tracking-widest">⚠️ FORMATEAR SISTEMA COMPLETO</button>
        </div>

        <div class="lg:col-span-8">
            <div class="hud-panel p-6 min-h-[600px]">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="orbitron text-sm">ALMACÉN DE NODOS</h2>
                    <span id="node-count" class="text-[10px] bg-cyan-900 px-2 py-1 rounded">0 ARCHIVOS</span>
                </div>

                <div id="grid-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    </div>

                <div id="empty-msg" class="hidden h-64 flex flex-col items-center justify-center opacity-30">
                    <span class="text-6xl mb-4">💾</span>
                    <span class="orbitron tracking-widest">MEMORIA VACÍA</span>
                </div>
            </div>
        </div>
    </main>

    <div id="preview-modal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col p-4 md:p-10">
        <div class="flex justify-between items-center mb-4 border-b border-cyan-800 pb-2">
            <h2 class="orbitron text-white">VISUALIZADOR</h2>
            <button onclick="closeModal()" class="btn-danger px-4 py-1 text-xs font-bold uppercase">CERRAR [X]</button>
        </div>
        <div id="modal-content" class="flex-grow bg-black border border-cyan-900 flex items-center justify-center relative">
            </div>
    </div>

    <script>
        // --- CONSTANTES Y ESTADO ---
        const DB_NAME = "NexusCore_DB";
        const DB_VERSION = 2; // Incrementado para asegurar limpieza de versiones viejas
        let db;

        // --- INICIO ---
        window.addEventListener('DOMContentLoaded', () => {
            initDatabase();
            setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString('es-ES'), 1000);
        });

        // --- BASE DE DATOS (INDEXED DB ROBUSTA) ---
        function initDatabase() {
            log("Conectando al núcleo de memoria (IndexedDB)...");
            const request = indexedDB.open(DB_NAME, DB_VERSION);

            request.onupgradeneeded = (event) => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains('files')) {
                    db.createObjectStore('files', { keyPath: 'id' });
                    log("Esquema de base de datos creado.");
                }
            };

            request.onsuccess = (event) => {
                db = event.target.result;
                document.getElementById('db-status').innerText = "● DB: CONECTADA Y SEGURA";
                document.getElementById('db-status').className = "text-xs font-bold text-green-500 mb-1";
                log("Conexión estable. Cargando datos...");
                loadAllData(); // <--- AQUÍ SE CARGA TODO AL INICIAR
            };

            request.onerror = (event) => {
                document.getElementById('db-status').innerText = "● ERROR CRÍTICO DB";
                document.getElementById('db-status').className = "text-xs font-bold text-red-500 mb-1";
                log("Error DB: " + event.target.error);
            };
        }

        // --- GESTIÓN DE ARCHIVOS (APKS, VIDEOS, ETC) ---
        function processFile(input) {
            const file = input.files[0];
            if (!file) return;

            const status = document.getElementById('upload-status');
            status.style.opacity = '1';
            log(`Procesando binario: ${file.name}...`);

            const reader = new FileReader();
            reader.readAsArrayBuffer(file);

            reader.onload = function(e) {
                const blob = new Blob([e.target.result], { type: file.type });
                
                const newFile = {
                    id: Date.now(),
                    name: file.name,
                    type: file.type || 'unknown/file',
                    isLink: false,
                    blob: blob, // Guardamos el archivo real
                    size: (file.size / 1024 / 1024).toFixed(2) + ' MB',
                    date: new Date().toLocaleDateString()
                };

                saveToDB(newFile);
                status.style.opacity = '0';
                input.value = ''; // Limpiar input
            };
        }

        function saveWebLink() {
            const name = document.getElementById('linkName').value;
            const url = document.getElementById('linkURL').value;
            if(!name || !url) return log("Error: Faltan campos.");

            const newLink = {
                id: Date.now(),
                name: name,
                type: 'ENLACE WEB',
                isLink: true,
                url: url.startsWith('http') ? url : 'https://' + url,
                size: 'URL',
                date: new Date().toLocaleDateString()
            };

            saveToDB(newLink);
            document.getElementById('linkName').value = '';
            document.getElementById('linkURL').value = '';
        }

        // --- OPERACIONES DB ---
        function saveToDB(item) {
            const transaction = db.transaction(['files'], 'readwrite');
            const store = transaction.objectStore('files');
            const request = store.add(item);

            request.onsuccess = () => {
                log(`Datos guardados con éxito: ${item.name}`);
                loadAllData(); // Recargar la vista
            };
            request.onerror = () => log("Error al escribir en disco.");
        }

        function loadAllData() {
            const transaction = db.transaction(['files'], 'readonly');
            const store = transaction.objectStore('files');
            const request = store.getAll();

            request.onsuccess = () => {
                const items = request.result;
                renderGrid(items);
            };
        }

        function deleteItem(id) {
            if(confirm("¿Confirmar eliminación definitiva?")) {
                const transaction = db.transaction(['files'], 'readwrite');
                const store = transaction.objectStore('files');
                store.delete(id);
                transaction.oncomplete = () => {
                    log("Elemento eliminado.");
                    loadAllData();
                };
            }
        }

        function wipeSystem() {
            if(confirm("PELIGRO: ESTO BORRARÁ TODOS LOS ARCHIVOS Y ENLACES GUARDADOS.\n¿CONTINUAR?")) {
                const req = indexedDB.deleteDatabase(DB_NAME);
                req.onsuccess = () => location.reload();
            }
        }

        // --- RENDERIZADO (VISUAL) ---
        function renderGrid(items) {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            document.getElementById('node-count').innerText = `${items.length} NODOS`;

            if(items.length === 0) {
                document.getElementById('empty-msg').classList.remove('hidden');
                return;
            } else {
                document.getElementById('empty-msg').classList.add('hidden');
            }

            // Ordenar: lo más nuevo primero
            items.sort((a, b) => b.id - a.id).forEach(item => {
                const card = document.createElement('div');
                card.className = "hud-panel p-4 flex flex-col gap-3 hover:border-cyan-400 transition-colors animate-[scanline_0.5s_ease-out]";
                
                // Icono según tipo
                let icon = '📄';
                if(item.isLink) icon = '🌐';
                else if(item.type.includes('image')) icon = '🖼️';
                else if(item.type.includes('video')) icon = '🎬';
                else if(item.name.endsWith('.apk')) icon = '🤖';
                else if(item.type.includes('pdf')) icon = '📕';

                // Botones dinámicos
                let actionBtn = '';
                if(item.isLink) {
                    actionBtn = `<button onclick="window.open('${item.url}', '_blank')" class="cyber-btn flex-grow">ABRIR ↗</button>`;
                } else {
                    actionBtn = `<button onclick="downloadFile(${item.id})" class="cyber-btn btn-success flex-grow flex items-center justify-center gap-2">RECUPERAR ⬇</button>`;
                }

                // Botón monitor (solo si es visualizable)
                let monitorBtn = '';
                if(item.isLink || item.type.includes('image') || item.type.includes('video') || item.type.includes('pdf')) {
                    monitorBtn = `<button onclick="openPreview(${item.id})" class="cyber-btn w-1/3">VER</button>`;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="text-[9px] font-bold text-cyan-600 bg-black px-2 py-0.5 border border-cyan-900 rounded">${item.type.toUpperCase().slice(0,12)}</span>
                        <button onclick="deleteItem(${item.id})" class="text-red-500 hover:text-white font-bold text-xs">[X]</button>
                    </div>
                    
                    <div class="flex items-center gap-4">
                        <div class="text-3xl bg-cyan-900/20 p-2 rounded border border-cyan-900/50">${icon}</div>
                        <div class="overflow-hidden">
                            <h4 class="font-bold text-sm truncate text-white" title="${item.name}">${item.name}</h4>
                            <p class="text-[9px] opacity-60 font-mono">${item.size} • ${item.date}</p>
                        </div>
                    </div>

                    <div class="mt-auto flex gap-2">
                        ${actionBtn}
                        ${monitorBtn}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- FUNCIONALIDAD DE DESCARGA Y VISTA ---
        function downloadFile(id) {
            const tx = db.transaction(['files'], 'readonly');
            const store = tx.objectStore('files');
            const req = store.get(id);

            req.onsuccess = () => {
                const item = req.result;
                if(item && item.blob) {
                    const url = URL.createObjectURL(item.blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = item.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    log(`Descarga iniciada: ${item.name}`);
                }
            };
        }

        function openPreview(id) {
            const tx = db.transaction(['files'], 'readonly');
            const store = tx.objectStore('files');
            const req = store.get(id);

            req.onsuccess = () => {
                const item = req.result;
                const modal = document.getElementById('preview-modal');
                const content = document.getElementById('modal-content');
                content.innerHTML = ''; // Limpiar previo

                if(item.isLink) {
                    content.innerHTML = `<iframe src="${item.url}" class="w-full h-full border-none bg-white"></iframe>`;
                } else if (item.blob) {
                    const url = URL.createObjectURL(item.blob);
                    if(item.type.includes('image')) content.innerHTML = `<img src="${url}" class="max-w-full max-h-full object-contain">`;
                    else if(item.type.includes('video')) content.innerHTML = `<video src="${url}" controls autoplay class="max-w-full max-h-full"></video>`;
                    else if(item.type.includes('pdf')) content.innerHTML = `<iframe src="${url}" class="w-full h-full bg-white"></iframe>`;
                }
                modal.classList.remove('hidden');
            };
        }

        function closeModal() {
            document.getElementById('modal-content').innerHTML = '';
            document.getElementById('preview-modal').classList.add('hidden');
        }

        function log(msg) {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.innerHTML = `> <span class="text-cyan-500">${new Date().toLocaleTimeString()}</span>: ${msg}`;
            logs.prepend(div);
        }
    </script>
</body>
</html>
