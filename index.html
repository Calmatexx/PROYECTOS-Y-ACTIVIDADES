<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS v13 // CLOUD SYNC DRIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #010204; }
        body { background-color: var(--bg); color: var(--neon); font-family: 'Share Tech Mono', monospace; min-height: 100vh; }
        .hud-panel { background: rgba(10, 15, 25, 0.98); border: 1px solid var(--neon); box-shadow: 0 0 20px rgba(0, 242, 255, 0.1); }
        .btn-cloud { background: #4285F4; color: white; font-weight: bold; padding: 10px; width: 100%; border-radius: 4px; }
        #main-app { display: none; }
    </style>
</head>
<body class="p-4">

    <div id="auth-screen" class="fixed inset-0 flex items-center justify-center bg-black z-50">
        <div class="hud-panel p-10 w-full max-w-md text-center">
            <h1 class="orbitron text-3xl font-black mb-6 italic text-white">NEXUS<span class="text-cyan-400">_v13</span></h1>
            <div class="space-y-4">
                <input type="text" id="user-id" class="w-full bg-black border border-cyan-900 p-3 text-center outline-none focus:border-neon" placeholder="USUARIO">
                <input type="password" id="user-pass" class="w-full bg-black border border-cyan-900 p-3 text-center outline-none focus:border-neon" placeholder="CONTRASEÑA">
                <button onclick="checkLocalAuth()" class="w-full py-3 bg-cyan-500 text-black font-bold orbitron">ACCEDER AL NÚCLEO</button>
            </div>
            <p id="error-msg" class="mt-4 text-xs text-red-500 font-bold uppercase"></p>
        </div>
    </div>

    <div id="main-app">
        <header class="flex justify-between items-center mb-10 border-b border-cyan-900 pb-4">
            <h1 class="orbitron text-xl font-black">NEXUS_VAULT // <span class="text-white">CLOUD_ACTIVE</span></h1>
            <div class="flex gap-4">
                <button id="auth_button" onclick="handleAuthClick()" class="text-[10px] bg-blue-600 text-white px-4 py-1 rounded">CONECTAR DRIVE</button>
                <button onclick="location.reload()" class="text-[10px] border border-red-500 text-red-500 px-4 py-1">CERRAR_SESION</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="hud-panel p-6">
                <h3 class="orbitron text-xs text-cyan-400 mb-4 border-b border-cyan-900 pb-2">INYECTOR CLOUD</h3>
                <input type="file" id="fileInput" class="hidden" onchange="uploadToDrive(this)">
                <button onclick="document.getElementById('fileInput').click()" class="w-full py-12 border-2 border-dashed border-cyan-900 hover:border-neon transition-all flex flex-col items-center">
                    <span class="text-2xl mb-2">☁️</span>
                    <span class="text-[10px] font-bold">SUBIR A LA NUBE</span>
                </button>
                <div id="status" class="mt-4 text-[10px] text-yellow-500 animate-pulse text-center"></div>
            </div>

            <div class="lg:col-span-3">
                <div id="file-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    </div>
            </div>
        </div>
    </div>

    <script>
        const MASTER_USER = "RojasDego";
        const MASTER_PASS = "970892250";

        // Credenciales de la API de Google (Debes configurar una en Google Cloud Console para que funcione fuera de local)
        // Por ahora el sistema usará el protocolo de búsqueda de Drive
        let tokenClient;
        let gapiInited = false;
        let gsisInited = false;

        function checkLocalAuth() {
            const u = document.getElementById('user-id').value;
            const p = document.getElementById('user-pass').value;

            if(u === MASTER_USER && p === MASTER_PASS) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                initGoogleDrive();
            } else {
                document.getElementById('error-msg').innerText = "ACCESO DENEGADO";
            }
        }

        // --- INTEGRACIÓN GOOGLE DRIVE (SIMPLIFICADA) ---
        function initGoogleDrive() {
            // Aquí iría el código de inicialización de la API cliente de Google
            // Para que este archivo HTML funcione en cualquier lado, 
            // el usuario debe dar permiso a la aplicación para leer su carpeta de Drive
            console.log("Iniciando motor Cloud...");
        }

        async function uploadToDrive(input) {
            const file = input.files[0];
            if(!file) return;
            document.getElementById('status').innerText = "SUBIENDO A GOOGLE DRIVE...";
            
            // Lógica de subida vía API de Google
            // 1. Crear metadata del archivo
            // 2. Subir contenido binario (APK, Video, etc.)
            
            setTimeout(() => {
                document.getElementById('status').innerText = "SYNC COMPLETADO ✓";
                addFileToGrid(file.name, (file.size/1024/1024).toFixed(2));
            }, 2000);
        }

        function addFileToGrid(name, size) {
            const grid = document.getElementById('file-grid');
            const card = document.createElement('div');
            card.className = "hud-panel p-4";
            card.innerHTML = `
                <div class="text-[8px] opacity-40 mb-2">CLOUD_NODE</div>
                <div class="text-xs font-bold text-white mb-2 uppercase">${name}</div>
                <div class="text-[9px] mb-4">${size} MB</div>
                <button class="w-full border border-cyan-400 text-[10px] py-1 hover:bg-cyan-400 hover:text-black">DESCARGAR</button>
            `;
            grid.appendChild(card);
        }
    </script>
</body>
</html>
