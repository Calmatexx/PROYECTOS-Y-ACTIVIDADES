<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS v12.1 // ROJASDEGO PRIVADO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #010204; --panel: rgba(10, 15, 25, 0.98); }
        body {
            background-color: var(--bg); color: var(--neon); font-family: 'Share Tech Mono', monospace;
            background-image: radial-gradient(circle at 50% 50%, #001a1a 0%, #010204 100%);
            min-height: 100vh; overflow: hidden;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        #auth-overlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 1000;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
        }

        .hud-panel {
            background: var(--panel); border: 1px solid var(--neon);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
        }

        .cyber-input {
            background: #000; border: 1px solid #004455; color: white;
            padding: 12px; width: 100%; outline: none; transition: 0.3s;
        }
        .cyber-input:focus { border-color: var(--neon); box-shadow: 0 0 15px var(--neon); }

        .btn-auth {
            background: var(--neon); color: black; font-weight: bold;
            padding: 12px; width: 100%; text-transform: uppercase;
            letter-spacing: 2px; cursor: pointer;
        }

        #main-content { display: none; height: 100vh; overflow-y: auto; }
        
        .node-card { border-left: 4px solid var(--neon); transition: 0.2s; }
        .node-card:hover { transform: translateY(-5px); border-color: white; }

        .glitch-text { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="hud-panel p-10 w-full max-w-md text-center">
            <div class="mb-6">
                <div class="text-[10px] text-cyan-500 tracking-[10px] mb-2">SECURITY_PROTOCOL</div>
                <h1 class="orbitron text-4xl font-black italic">NEXUS<span class="text-white">_v12</span></h1>
            </div>
            
            <div class="space-y-5">
                <div>
                    <input type="text" id="user-id" class="cyber-input text-center orbitron text-sm" placeholder="USUARIO">
                </div>
                <div>
                    <input type="password" id="user-pass" class="cyber-input text-center" placeholder="CONTRASEÑA">
                </div>
                <button onclick="attemptLogin()" class="btn-auth orbitron">INICIAR SESIÓN</button>
            </div>
            <p id="auth-msg" class="mt-6 text-[10px] text-red-500 font-bold uppercase tracking-widest"></p>
        </div>
        <p class="mt-8 text-[9px] opacity-30 orbitron">AUTHORIZED PERSONNEL ONLY - LIMA_2026</p>
    </div>

    <div id="main-content" class="p-4 md:p-8">
        <header class="max-w-7xl mx-auto flex justify-between items-center mb-8 border-b border-cyan-900 pb-4">
            <div>
                <h1 class="orbitron text-2xl font-black tracking-tighter">NEXUS<span class="text-white">_VAULT</span></h1>
                <div class="text-[9px] flex items-center gap-2">
                    <span class="text-green-500 animate-pulse">●</span> BIENVENIDO, <span id="user-tag" class="text-white font-bold"></span>
                </div>
            </div>
            <button onclick="location.reload()" class="text-[10px] border border-red-500 text-red-500 px-6 py-1 hover:bg-red-500 hover:text-white transition-all uppercase font-bold">Desconectar</button>
        </header>

        <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="space-y-6">
                <div class="hud-panel p-6">
                    <h3 class="orbitron text-[10px] mb-4 text-cyan-400">// SUBIR_NODO</h3>
                    <input type="file" id="fileInput" class="hidden" onchange="uploadFile(this)">
                    <button onclick="document.getElementById('fileInput').click()" class="w-full py-10 border-2 border-dashed border-cyan-900 hover:border-neon transition-all flex flex-col items-center">
                        <span class="text-2xl mb-2">📁</span>
                        <span class="text-[10px] font-bold">SELECCIONAR BINARIO</span>
                    </button>
                    <div id="up-status" class="text-[9px] text-yellow-500 hidden mt-2 text-center italic">SINCRONIZANDO...</div>
                </div>

                <div class="hud-panel p-4 h-48 overflow-y-auto text-[9px] font-mono text-cyan-600" id="logs">
                    <div>> Esperando instrucciones...</div>
                </div>
            </div>

            <div class="lg:col-span-3">
                <div class="mb-4 flex gap-4">
                    <input type="text" id="search" oninput="filterFiles()" placeholder="FILTRAR POR NOMBRE..." class="bg-black border border-cyan-900 w-full p-2 text-xs outline-none focus:border-neon">
                </div>
                <div id="file-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
                <div id="empty-msg" class="text-center py-20 opacity-10 orbitron tracking-[15px] hidden">STORAGE_EMPTY</div>
            </div>
        </main>
    </div>

    <div id="preview-modal" class="fixed inset-0 bg-black/98 z-[2000] hidden flex flex-col p-6">
        <div class="flex justify-between items-center mb-4 border-b border-cyan-800 pb-2">
            <h2 id="modal-title" class="orbitron text-xs">MONITOR_DATA</h2>
            <button onclick="closeModal()" class="text-red-500 orbitron text-xs font-bold">[ CERRAR_X ]</button>
        </div>
        <div id="modal-content" class="flex-grow flex items-center justify-center overflow-auto"></div>
    </div>

    <script>
        // CREDENCIALES MAESTRAS
        const MASTER_USER = "RojasDego";
        const MASTER_PASS = "970892250";

        const DB_NAME = "NexusVault_RojasDego";
        const DB_VERSION = 1;
        let db;

        // INICIALIZACIÓN
        window.addEventListener('DOMContentLoaded', () => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onupgradeneeded = (e) => {
                e.target.result.createObjectStore('files', { keyPath: 'id' });
            };
            request.onsuccess = (e) => { db = e.target.result; };
        });

        // VALIDACIÓN DE ACCESO
        function attemptLogin() {
            const user = document.getElementById('user-id').value;
            const pass = document.getElementById('user-pass').value;

            if(user === MASTER_USER && pass === MASTER_PASS) {
                accessGranted();
            } else {
                showAuthMsg("ACCESO DENEGADO: CREDENCIALES INVÁLIDAS");
                addLog("Alerta: Intento de acceso fallido.");
            }
        }

        function accessGranted() {
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('user-tag').innerText = MASTER_USER.toUpperCase();
            loadFiles();
            addLog(`Bienvenido, ${MASTER_USER}. Acceso total concedido.`);
        }

        // GESTIÓN DE ARCHIVOS
        function uploadFile(input) {
            const file = input.files[0];
            if(!file) return;

            document.getElementById('up-status').classList.remove('hidden');
            const reader = new FileReader();
            reader.readAsArrayBuffer(file);

            reader.onload = (e) => {
                const item = {
                    id: Date.now(),
                    name: file.name,
                    type: file.type || 'application/octet-stream',
                    size: (file.size / 1024 / 1024).toFixed(2) + ' MB',
                    blob: new Blob([e.target.result], { type: file.type }),
                    date: new Date().toLocaleDateString()
                };

                const tx = db.transaction(['files'], 'readwrite');
                tx.objectStore('files').add(item);
                tx.oncomplete = () => {
                    document.getElementById('up-status').classList.add('hidden');
                    addLog(`Archivo inyectado: ${file.name}`);
                    loadFiles();
                    input.value = '';
                };
            };
        }

        function loadFiles() {
            const tx = db.transaction(['files'], 'readonly');
            tx.objectStore('files').getAll().onsuccess = (e) => {
                renderGrid(e.target.result);
            };
        }

        function renderGrid(items) {
            const grid = document.getElementById('file-grid');
            grid.innerHTML = '';
            
            if(items.length === 0) {
                document.getElementById('empty-msg').classList.remove('hidden');
                return;
            }
            document.getElementById('empty-msg').classList.add('hidden');

            items.sort((a,b) => b.id - a.id).forEach(item => {
                const card = document.createElement('div');
                card.className = "hud-panel p-4 node-card bg-black/40";
                card.setAttribute('data-name', item.name.toLowerCase());
                
                let icon = '📄';
                if(item.name.endsWith('.apk')) icon = '🤖';
                else if(item.type.includes('image')) icon = '🖼️';
                else if(item.type.includes('video')) icon = '🎬';

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[8px] opacity-40 orbitron">NODE_${item.id}</span>
                        <button onclick="deleteFile(${item.id})" class="text-red-900 hover:text-red-500 font-bold">×</button>
                    </div>
                    <div class="flex items-center gap-3 mb-4">
                        <span class="text-3xl">${icon}</span>
                        <div class="overflow-hidden">
                            <h4 class="text-xs font-bold truncate text-white uppercase">${item.name}</h4>
                            <p class="text-[8px] opacity-40">${item.size} // ${item.date}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="viewFile(${item.id})" class="border border-cyan-400 text-[9px] py-1 hover:bg-cyan-400 hover:text-black orbitron">MONITOR</button>
                        <button onclick="downloadFile(${item.id})" class="border border-white text-[9px] py-1 hover:bg-white hover:text-black orbitron">RECUPERAR</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function viewFile(id) {
            const tx = db.transaction(['files'], 'readonly');
            tx.objectStore('files').get(id).onsuccess = (e) => {
                const item = e.target.result;
                const modal = document.getElementById('preview-modal');
                const content = document.getElementById('modal-content');
                document.getElementById('modal-title').innerText = item.name;
                content.innerHTML = '';

                const url = URL.createObjectURL(item.blob);
                if(item.type.includes('image')) content.innerHTML = `<img src="${url}" class="max-w-full max-h-full">`;
                else if(item.type.includes('video')) content.innerHTML = `<video src="${url}" controls class="max-w-full max-h-full"></video>`;
                else content.innerHTML = `<div class="text-center p-10"><p class="orbitron">SIN PREVISUALIZACIÓN</p><p class="text-[10px] opacity-40 mt-2">${item.type}</p></div>`;
                
                modal.classList.remove('hidden');
            };
        }

        function downloadFile(id) {
            const tx = db.transaction(['files'], 'readonly');
            tx.objectStore('files').get(id).onsuccess = (e) => {
                const item = e.target.result;
                const a = document.createElement('a');
                a.href = URL.createObjectURL(item.blob);
                a.download = item.name;
                a.click();
            };
        }

        function deleteFile(id) {
            if(confirm("¿Eliminar este nodo permanentemente?")) {
                const tx = db.transaction(['files'], 'readwrite');
                tx.objectStore('files').delete(id);
                tx.oncomplete = () => loadFiles();
            }
        }

        function filterFiles() {
            const q = document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('#file-grid > div').forEach(c => {
                c.style.display = c.getAttribute('data-name').includes(q) ? 'block' : 'none';
            });
        }

        function showAuthMsg(m) {
            const el = document.getElementById('auth-msg');
            el.innerText = m;
            setTimeout(() => el.innerText = "", 3000);
        }

        function addLog(m) {
            const l = document.getElementById('logs');
            l.innerHTML = `<div>> ${m}</div>` + l.innerHTML;
        }

        function closeModal() {
            document.getElementById('modal-content').innerHTML = '';
            document.getElementById('preview-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
