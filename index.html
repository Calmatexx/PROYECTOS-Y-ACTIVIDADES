<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS ENGINE v7.0 // ELITE TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #010103; --panel: rgba(0, 20, 35, 0.9); }
        body {
            background-color: var(--bg); color: var(--neon); font-family: 'Share Tech Mono', monospace;
            background-image: radial-gradient(circle at 50% 50%, #001a1a 0%, #010103 100%);
            min-height: 100vh; overflow-x: hidden;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        /* HUD DESIGN */
        .hud-frame {
            border: 1px solid var(--neon); box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
            background: var(--panel); position: relative;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        
        /* LOADING ANIMATION */
        @keyframes pulse-border { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
        .loading-signal { animation: pulse-border 1.5s infinite; }

        .cyber-btn { border: 1px solid var(--neon); transition: 0.3s; font-size: 10px; background: rgba(0, 242, 255, 0.05); }
        .cyber-btn:hover { background: var(--neon); color: black; box-shadow: 0 0 15px var(--neon); }
        
        .delete-btn { border: 1px solid #ff0055; color: #ff0055; }
        .delete-btn:hover { background: #ff0055; color: white; box-shadow: 0 0 15px #ff0055; }

        #preview-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 1000; padding: 2rem; }
        iframe, img { border: 1px solid var(--neon); width: 100%; height: 100%; background: #eee; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--neon); }
    </style>
</head>
<body class="p-4 md:p-8">

    <audio id="bg-music" loop><source src="musica1.mp3" type="audio/mpeg"></audio>

    <header class="max-w-[1600px] mx-auto flex justify-between items-center mb-8 border-b border-cyan-900 pb-4">
        <div>
            <h1 class="orbitron text-2xl font-black tracking-widest text-white">NEXUS<span class="text-cyan-400">_SYSTEM_v7</span></h1>
            <p class="text-[10px] opacity-50">STATION ID: TERMINAL-PERU-2026</p>
        </div>
        
        <div class="flex items-center gap-6">
            <div class="text-right hidden sm:block">
                <div id="clock" class="orbitron text-lg font-bold">00:00:00</div>
                <div class="text-[9px] text-green-500 loading-signal">● DATALINK ACTIVE</div>
            </div>
            <button id="audio-btn" onclick="toggleAudio()" class="w-12 h-12 hud-frame flex items-center justify-center text-xl hover:scale-110 transition-transform">🔈</button>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <div class="space-y-6">
            <div class="hud-frame p-5">
                <h3 class="orbitron text-xs mb-4 text-cyan-400 uppercase tracking-tighter">// INYECTOR_DATOS</h3>
                
                <label class="block group cursor-pointer">
                    <div class="border border-dashed border-cyan-700 p-6 text-center group-hover:border-cyan-400 transition-colors">
                        <span class="text-3xl block mb-2">💾</span>
                        <span class="text-[10px] uppercase font-bold">Subir Archivo</span>
                    </div>
                    <input type="file" id="fileInput" class="hidden" onchange="uploadHandler(this)">
                </label>

                <div class="mt-6 space-y-3">
                    <input type="text" id="linkName" placeholder="ALIAS DEL NODO" class="input-cyber w-full p-2 bg-black border border-cyan-900 text-xs text-white">
                    <input type="text" id="linkURL" placeholder="URL DEL NODO (https://...)" class="input-cyber w-full p-2 bg-black border border-cyan-900 text-xs text-white">
                    <button onclick="addWebLink()" class="cyber-btn w-full py-2 font-bold uppercase">Vincular Web</button>
                </div>
            </div>

            <div class="hud-frame p-4 h-64 flex flex-col">
                <h3 class="orbitron text-[9px] mb-3 text-cyan-400">// CONSOLA_LOGS</h3>
                <div id="logs" class="overflow-y-auto flex-grow text-[10px] space-y-1 opacity-80">
                    <div class="text-cyan-700">> Núcleo de red iniciado...</div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-3">
            <div class="hud-frame p-6 min-h-[70vh]">
                <div class="flex justify-between items-center mb-6 border-b border-cyan-900 pb-2">
                    <span class="orbitron text-xs tracking-widest uppercase">Explorador de Nodos</span>
                    <span id="counter" class="text-[10px] opacity-50">NODOS: 0</span>
                </div>

                <div id="file-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                    </div>

                <div id="empty-state" class="mt-20 text-center opacity-20">
                    <div class="text-6xl mb-4">🛸</div>
                    <p class="orbitron tracking-[10px]">VACÍO</p>
                </div>
            </div>
        </div>
    </main>

    <div id="preview-modal">
        <div class="h-full flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modal-title" class="orbitron text-cyan-400 text-sm">MONITOR_ACTIVO</h2>
                <button onclick="closePreview()" class="delete-btn px-6 py-1 text-xs uppercase font-bold">Cerrar Sesión</button>
            </div>
            <div id="modal-body" class="flex-grow bg-black shadow-[0_0_50px_rgba(0,242,255,0.1)]"></div>
        </div>
    </div>

    <script>
        // Reloj Local
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('es-ES'); }, 1000);

        // Inicializar Sistema
        document.addEventListener('DOMContentLoaded', loadStorage);

        function addLog(msg) {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.innerText = `> ${msg}`;
            logs.prepend(div);
        }

        // --- MANEJO DE ARCHIVOS ---
        function uploadHandler(input) {
            const file = input.files[0];
            if(!file) return;

            const size = (file.size / 1024).toFixed(1) + " KB";
            const localUrl = URL.createObjectURL(file);
            const date = new Date().toLocaleDateString();

            const nodeData = {
                id: Date.now(),
                name: file.name,
                type: file.type.toUpperCase() || 'DATA',
                url: localUrl,
                icon: file.type.includes('image') ? '🖼️' : '📕',
                stats: `TAMAÑO: ${size} | FECHA: ${date}`,
                isLocal: true
            };

            renderCard(nodeData);
            addLog(`Archivo inyectado: ${file.name} (${size})`);
        }

        // --- MANEJO DE ENLACES ---
        function addWebLink() {
            const name = document.getElementById('linkName').value;
            const url = document.getElementById('linkURL').value;
            if(!name || !url) return addLog("ERROR: Datos incompletos");

            const finalUrl = url.startsWith('http') ? url : 'https://' + url;
            const nodeData = {
                id: Date.now(),
                name: name.toUpperCase(),
                type: 'ENLACE_WEB',
                url: finalUrl,
                icon: '🌐',
                stats: `FECHA: ${new Date().toLocaleDateString()}`,
                isLocal: false
            };

            renderCard(nodeData);
            saveToStorage(nodeData);
            
            document.getElementById('linkName').value = '';
            document.getElementById('linkURL').value = '';
            addLog(`Enlace sincronizado: ${name}`);
        }

        function renderCard(node) {
            document.getElementById('empty-state').style.display = 'none';
            const grid = document.getElementById('file-grid');
            const card = document.createElement('div');
            card.id = `node-${node.id}`;
            card.className = "hud-frame p-4 hover:border-white transition-all group animate-fade-in";
            card.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <span class="text-[9px] text-cyan-500 font-bold">${node.type}</span>
                    <button onclick="deleteNode(${node.id})" class="text-[10px] hover:text-red-500 opacity-30 hover:opacity-100">[ELIMINAR]</button>
                </div>
                <div class="text-3xl mb-2">${node.icon}</div>
                <h4 class="text-xs font-bold truncate text-white mb-1 uppercase">${node.name}</h4>
                <p class="text-[8px] opacity-40 mb-4 tracking-tighter">${node.stats}</p>
                <button onclick="openPreview('${node.url}', '${node.type}', '${node.name}')" class="cyber-btn w-full py-2 font-bold">ABRIR MONITOR</button>
            `;
            grid.prepend(card);
            updateCounter();
        }

        // --- MEMORIA ---
        function saveToStorage(node) {
            let nodes = JSON.parse(localStorage.getItem('nexus_db') || '[]');
            nodes.push(node);
            localStorage.setItem('nexus_db', JSON.stringify(nodes));
        }

        function loadStorage() {
            let nodes = JSON.parse(localStorage.getItem('nexus_db') || '[]');
            nodes.forEach(renderCard);
            addLog(`Memoria local recuperada. Nodos: ${nodes.length}`);
        }

        function deleteNode(id) {
            if(confirm("¿Deseas desconectar este nodo?")) {
                document.getElementById(`node-${id}`).remove();
                let nodes = JSON.parse(localStorage.getItem('nexus_db') || '[]');
                nodes = nodes.filter(n => n.id !== id);
                localStorage.setItem('nexus_db', JSON.stringify(nodes));
                updateCounter();
                addLog(`Nodo ${id} desconectado.`);
            }
        }

        function updateCounter() {
            const count = document.getElementById('file-grid').children.length;
            document.getElementById('counter').innerText = `NODOS: ${count}`;
            if(count === 0) document.getElementById('empty-state').style.display = 'block';
        }

        // --- MONITOR & AUDIO ---
        function openPreview(url, type, name) {
            const modal = document.getElementById('preview-modal');
            const body = document.getElementById('modal-body');
            document.getElementById('modal-title').innerText = `MONITORIZANDO NODO // ${name}`;
            
            body.innerHTML = '<div class="h-full flex items-center justify-center orbitron animate-pulse">CARGANDO SEÑAL...</div>';
            
            setTimeout(() => {
                if (type.includes('IMAGE')) {
                    body.innerHTML = `<img src="${url}" style="object-fit: contain; background: #000;">`;
                } else {
                    body.innerHTML = `<iframe src="${url}" allow="autoplay"></iframe>`;
                }
            }, 500);
            
            modal.style.display = 'block';
        }

        function closePreview() {
            document.getElementById('modal-body').innerHTML = '';
            document.getElementById('preview-modal').style.display = 'none';
        }

        function toggleAudio() {
            const music = document.getElementById('bg-music');
            const btn = document.getElementById('audio-btn');
            if(music.paused) { music.play(); btn.innerHTML = "🔊"; btn.style.background = "var(--neon)"; btn.style.color = "black"; }
            else { music.pause(); btn.innerHTML = "🔈"; btn.style.background = "transparent"; btn.style.color = "var(--neon)"; }
        }
    </script>
</body>
</html>
