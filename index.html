<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS ENGINE v6.0 // HYBRID CORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #010103; --alert: #ff0055; --panel: rgba(0, 15, 30, 0.9); }
        body {
            background-color: var(--bg); color: var(--neon); font-family: 'Share Tech Mono', monospace;
            background-image: linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px; min-height: 100vh; overflow-x: hidden;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .hud-frame {
            border: 1px solid var(--neon); box-shadow: inset 0 0 15px rgba(0, 242, 255, 0.1), 0 0 10px rgba(0, 242, 255, 0.1);
            background: var(--panel); backdrop-filter: blur(8px); position: relative;
            clip-path: polygon(0 0, 97% 0, 100% 3%, 100% 100%, 3% 100%, 0 97%);
        }
        .hud-frame::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(0, 242, 255, 0.2); animation: scan 4s infinite linear; pointer-events: none;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .bar { width: 3px; background: var(--neon); animation: eq 0.8s infinite ease-in-out; }
        @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 18px; } }
        .cyber-btn { border: 1px solid var(--neon); transition: 0.3s; text-transform: uppercase; letter-spacing: 2px; font-size: 10px; background: rgba(0,0,0,0.5); color: var(--neon); }
        .cyber-btn:hover { background: var(--neon); color: black; box-shadow: 0 0 20px var(--neon); }
        #preview-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; padding: 1.5rem; }
        iframe, img { border-radius: 4px; border: 1px solid #004455; width: 100%; height: 100%; }
        .log-entry { font-size: 10px; border-left: 2px solid var(--neon); padding-left: 8px; margin-bottom: 4px; opacity: 0.7; }
        .input-cyber { background: rgba(0, 242, 255, 0.05); border: 1px solid #004455; color: white; padding: 8px; font-size: 11px; width: 100%; outline: none; transition: 0.3s; }
        .input-cyber:focus { border-color: var(--neon); box-shadow: 0 0 10px var(--neon); }
    </style>
</head>
<body class="p-2 md:p-6">

    <audio id="bg-music" loop><source src="musica1.mp3" type="audio/mpeg"></audio>

    <header class="max-w-[1600px] mx-auto hud-frame p-4 mb-6 flex justify-between items-center bg-black/40">
        <div class="flex items-center gap-6">
            <h1 class="orbitron text-xl font-black italic tracking-tighter uppercase">NEXUS<span class="text-white">_ENGINE_v6</span></h1>
            <div class="flex items-center gap-3 border-l border-cyan-800 pl-6">
                <button id="audio-btn" onclick="toggleAudio()" class="w-8 h-8 border border-cyan-400 flex items-center justify-center hover:bg-cyan-400/20 transition-all">🔈</button>
                <span id="audio-status" class="text-[9px] orbitron opacity-50 uppercase">AUDIO: STANDBY</span>
            </div>
        </div>
        <div class="hidden md:flex gap-8 items-center text-[10px]">
            <div id="clock" class="orbitron font-bold">00:00:00</div>
            <div class="text-green-500 border border-green-500 px-2 py-1 animate-pulse uppercase">CORE_STABLE</div>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-3 space-y-6">
            <div class="hud-frame p-5">
                <h3 class="orbitron text-[9px] mb-4 text-cyan-400 tracking-widest uppercase">// UPLOAD_DATA</h3>
                <input type="file" id="fileInput" class="hidden" onchange="uploadHandler(this)">
                <div onclick="document.getElementById('fileInput').click()" class="border border-dashed border-cyan-700 h-24 flex flex-col items-center justify-center cursor-pointer group hover:bg-cyan-400/5">
                    <span class="text-2xl mb-1">📂</span>
                    <span class="text-[8px] font-bold opacity-60 uppercase">SELECCIONAR ARCHIVO</span>
                </div>
                <div id="progress-box" class="mt-4 hidden">
                    <div class="w-full bg-cyan-950 h-1"><div id="progress-bar" class="bg-cyan-400 h-full w-0"></div></div>
                </div>
            </div>

            <div class="hud-frame p-5">
                <h3 class="orbitron text-[9px] mb-4 text-cyan-400 tracking-widest uppercase">// URL_INJECTION</h3>
                <div class="space-y-3">
                    <input type="text" id="linkName" placeholder="NOMBRE DEL SITIO" class="input-cyber">
                    <input type="text" id="linkURL" placeholder="HTTPS://..." class="input-cyber">
                    <button onclick="addWebLink()" class="cyber-btn w-full py-2 font-bold">VINCULAR NODO</button>
                </div>
            </div>

            <div class="hud-frame p-4 h-48 flex flex-col">
                <h3 class="orbitron text-[9px] mb-3 text-cyan-400 uppercase">SESSION_LOGS</h3>
                <div id="logs" class="overflow-y-auto flex-grow text-cyan-300">
                    <div class="log-entry">> Inicializando Memoria Persistente...</div>
                </div>
            </div>
            
            <button onclick="clearDatabase()" class="cyber-btn w-full py-2 text-red-500 border-red-500 hover:bg-red-500 hover:text-white">LIMPIAR TODO EL SISTEMA</button>
        </div>

        <div class="lg:col-span-9">
            <div class="hud-frame p-6 min-h-[600px] flex flex-col">
                <div class="flex justify-between items-center border-b border-cyan-900 pb-3 mb-6">
                    <h2 class="orbitron text-sm tracking-widest italic uppercase">DATABASE_EXPLORER</h2>
                </div>
                <div id="file-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
                <div id="empty-state" class="flex-grow flex flex-col items-center justify-center opacity-10">
                    <div class="text-7xl mb-4 text-cyan-500">📡</div>
                    <p class="orbitron text-xs uppercase">ESPERANDO TRANSMISIÓN DE DATOS...</p>
                </div>
            </div>
        </div>
    </main>

    <div id="preview-modal">
        <div class="max-w-6xl mx-auto h-full flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b border-cyan-800 pb-2">
                <span id="modal-title" class="orbitron text-xs text-cyan-400 uppercase tracking-widest">MONITOR</span>
                <button onclick="closePreview()" class="cyber-btn px-4 py-1 text-red-500 border-red-500 hover:bg-red-500 hover:text-white transition-all uppercase">TERMINAR PROCESO [X]</button>
            </div>
            <div id="modal-body" class="flex-grow bg-black relative"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = { apiKey: "TU_API_KEY", authDomain: "TU_PROYECTO.firebaseapp.com", projectId: "TU_PROYECTO", storageBucket: "TU_PROYECTO.appspot.com", messagingSenderId: "TU_ID", appId: "TU_APP_ID" };
        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);

        // --- INICIO DE SISTEMA Y CARGA DE MEMORIA ---
        document.addEventListener('DOMContentLoaded', () => {
            loadSavedNodes();
            setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('es-ES'); }, 1000);
        });

        function saveNode(name, type, url, icon) {
            let nodes = JSON.parse(localStorage.getItem('nexus_nodes') || '[]');
            nodes.push({ name, type, url, icon });
            localStorage.setItem('nexus_nodes', JSON.stringify(nodes));
        }

        function loadSavedNodes() {
            let nodes = JSON.parse(localStorage.getItem('nexus_nodes') || '[]');
            if(nodes.length > 0) document.getElementById('empty-state').style.display = 'none';
            nodes.forEach(node => addItemCard(node.name, node.type, node.url, node.icon, false));
            addLog(`Cargados ${nodes.length} nodos de la memoria local.`);
        }

        window.clearDatabase = function() {
            if(confirm("¿Deseas formatear toda la memoria local?")) {
                localStorage.removeItem('nexus_nodes');
                location.reload();
            }
        }

        window.toggleAudio = function() {
            const music = document.getElementById('bg-music');
            const btn = document.getElementById('audio-btn');
            const status = document.getElementById('audio-status');
            if(music.paused) { 
                music.play(); btn.classList.add('bg-cyan-400', 'text-black'); 
                status.innerText = "AUDIO: ACTIVE"; btn.innerHTML = "🔊"; addLog("Uplink de audio establecido.");
            } else { 
                music.pause(); btn.classList.remove('bg-cyan-400', 'text-black'); 
                status.innerText = "AUDIO: STANDBY"; btn.innerHTML = "🔈"; addLog("Uplink de audio terminado.");
            }
        }

        function addLog(msg) {
            const logs = document.getElementById('logs');
            const div = document.createElement('div'); div.className = 'log-entry'; div.innerText = `> ${msg}`;
            logs.prepend(div);
        }

        window.uploadHandler = function(input) {
            const file = input.files[0]; if(!file) return;
            addLog(`Inyectando archivo: ${file.name}`);
            const storageRef = ref(storage, 'cloud/' + file.name);
            const uploadTask = uploadBytesResumable(storageRef, file);
            
            document.getElementById('progress-box').classList.remove('hidden');
            uploadTask.on('state_changed', (snap) => {
                const p = (snap.bytesTransferred / snap.totalBytes) * 100;
                document.getElementById('progress-bar').style.width = p + '%';
            }, null, () => {
                getDownloadURL(uploadTask.snapshot.ref).then((url) => {
                    const typeLabel = 'FILE / ' + file.type.toUpperCase();
                    addItemCard(file.name, typeLabel, url, '📄', true);
                    document.getElementById('progress-box').classList.add('hidden');
                    document.getElementById('empty-state').style.display = 'none';
                    addLog(`Nodo guardado con éxito: ${file.name}`);
                });
            });
        }

        window.addWebLink = function() {
            const name = document.getElementById('linkName').value;
            const url = document.getElementById('linkURL').value;
            if(!name || !url) { addLog("Error de datos: Campos incompletos"); return; }
            const finalUrl = url.startsWith('http') ? url : 'https://' + url;
            addItemCard(name, 'WEB_LINK', finalUrl, '🌐', true);
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('linkName').value = '';
            document.getElementById('linkURL').value = '';
            addLog(`Enlace vinculado: ${name}`);
        }

        function addItemCard(name, type, url, icon, shouldSave) {
            const grid = document.getElementById('file-grid');
            const card = document.createElement('div');
            card.className = "hud-frame p-4 hover:border-white transition-all group cursor-pointer";
            card.innerHTML = `
                <div class="flex justify-between mb-2">
                    <span class="text-[7px] opacity-40 font-bold tracking-[2px]">${type}</span>
                    <span class="text-xs">${icon}</span>
                </div>
                <h4 class="text-xs font-bold truncate mb-4 uppercase text-white tracking-widest">${name}</h4>
                <div class="flex gap-2">
                    <button onclick="openPreview('${url}', '${type}', '${name}')" class="cyber-btn flex-grow py-1">MONITORIZAR</button>
                    <button onclick="window.open('${url}', '_blank')" class="cyber-btn px-2 py-1">↗</button>
                </div>
            `;
            grid.prepend(card);
            if(shouldSave) saveNode(name, type, url, icon);
        }

        window.openPreview = (url, type, name) => {
            const modal = document.getElementById('preview-modal');
            const body = document.getElementById('modal-body');
            document.getElementById('modal-title').innerText = `MONITORING_NODE: ${name}`;
            body.innerHTML = ''; 
            if (type.includes('IMAGE') || type.includes('FILE / IMAGE')) {
                body.innerHTML = `<img src="${url}" class="w-full h-full object-contain">`;
            } else {
                body.innerHTML = `<iframe src="${url}" id="active-frame" allow="autoplay"></iframe>`;
            }
            modal.style.display = 'block';
            addLog(`Uplink con nodo: ${name}`);
        }

        window.closePreview = () => {
            document.getElementById('modal-body').innerHTML = ''; 
            document.getElementById('preview-modal').style.display = 'none';
            addLog(`Sesión terminada. Señal limpia.`);
        }
    </script>
</body>
</html>
